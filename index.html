<!DOCTYPE html>
<html>
<head>
  <title>FaceNet Attendance System</title>
</head>
<body>
  <h2>FaceNet Face Attendance System</h2>
  <video id="video" width="320" height="240" autoplay></video><br><br>
  <button id="markBtn">📝 Mark Attendance</button>
  <button id="downloadBtn">📥 Download Today's Attendance</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const FLASK_URL = "https://a7bdc11ad372.ngrok-free.app"; // Update with your Ngrok URL

    // Start webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
      });

    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg");
    }

    // Mark attendance
    document.getElementById("markBtn").addEventListener("click", () => {
      const image = captureImage();

      fetch(`${FLASK_URL}/receive_image`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ image })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ " + data.message);
      })
      .catch(err => {
        alert("❌ Attendance Error: " + err);
      });
    });

    // Download CSV
    document.getElementById("downloadBtn").addEventListener("click", () => {
      window.open(`${FLASK_URL}/download_csv`, '_blank');
    });
  </script>
</body>
</html>
