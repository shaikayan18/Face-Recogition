<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Face Attendance System</title>
</head>
<body>
  <h2>Face Attendance System</h2>

  <!-- Webcam Preview -->
  <video id="video" width="320" height="240" autoplay></video><br>

  <!-- Input for User Name or ID -->
  <input type="text" id="username" placeholder="Enter Name or ID"><br><br>

  <!-- Buttons -->
  <button id="captureBtn">Capture & Register Face</button>
  <button id="trainBtn">Train Model</button>
  <button id="markBtn">Mark Attendance</button>

  <!-- Hidden Canvas -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // Access webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        document.getElementById('video').srcObject = stream;
      });

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    // Capture image from video
    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg");
    }

    // Register new user face
    document.getElementById("captureBtn").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("Please enter a name or ID first.");
        return;
      }
      const image = captureImage();

      fetch("https://your-render-app.onrender.com/register_image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, image })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ Registered: " + data.message);
      })
      .catch(err => alert("❌ Registration Error: " + err));
    });

    // Train the face recognition model
    document.getElementById("trainBtn").addEventListener("click", () => {
      fetch("https://your-render-app.onrender.com/train_model", {
        method: "POST"
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ Model trained: " + data.message);
      })
      .catch(err => alert("❌ Training Error: " + err));
    });

    // Mark attendance by recognizing face
    document.getElementById("markBtn").addEventListener("click", () => {
      const image = captureImage();

      fetch("https://face-recogition.onrender.com/receive_image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ Attendance marked: " + data.message);
      })
      .catch(err => alert("❌ Attendance Error: " + err));
    });
  </script>
</body>
</html>
