<!DOCTYPE html>
<html>
<head>
  <title>Face Attendance System</title>
</head>
<body>
  <h2>🧠 Face Attendance System</h2>

  <video id="video" width="320" height="240" autoplay></video><br><br>

  <button id="markBtn">📝 Mark Attendance</button>
  <button id="downloadBtn">📥 Download Today’s Attendance</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    // Load webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
      });

    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg");
    }

    // ✅ Mark Attendance
    document.getElementById("markBtn").addEventListener("click", () => {
      const image = captureImage();

      fetch("https://face-recogition-1.onrender.com/receive_image", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ image })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ Attendance: " + data.message);
        console.log("✅ Flask responded:", data);
      })
      .catch(err => {
        alert("❌ Attendance Error: " + err);
        console.error("❌ Fetch failed:", err);
      });
    });

    // 📥 Download Attendance CSV
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const today = new Date().toISOString().split('T')[0];
      const fileUrl = `https://face-recogition-1.onrender.com/download_attendance/Attendance_${today}.csv`;
      window.open(fileUrl, "_blank");
    });
  </script>
</body>
</html>
