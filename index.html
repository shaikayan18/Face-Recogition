<!DOCTYPE html>
<html>
<head>
  <title>Face Attendance System</title>
</head>
<body>
  <h2>Face Attendance System</h2>
  <video id="video" width="320" height="240" autoplay></video><br><br>
  <button id="markBtn">📝 Mark Attendance</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    // Start webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
      });

    // Capture image from webcam
    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg");
    }

    // Mark attendance button
    document.getElementById("markBtn").addEventListener("click", () => {
      const image = captureImage();

      fetch("https://a7bdc11ad372.ngrok-free.app/receive_image", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ image })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ " + data.message);
        console.log("✅ Server response:", data);
      })
      .catch(err => {
        alert("❌ Attendance Error: " + err);
        console.error("❌ Fetch failed:", err);
      });
    });
  </script>
</body>
</html>
